<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bağlantı yok · minokyo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #faf8f5; color: #141414;
      font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px 24px; box-sizing: border-box; }
    img { width: 96px; margin-bottom: 28px; }
    h1 { font-size: 18px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; }
    p { font-size: 15px; line-height: 1.6; color: #6f6a63; margin: 0 0 28px; max-width: 300px; }
    button { height: 52px; padding: 0 36px; border: 0; background: #141414; color: #fff;
      font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="minokyo" />
    <h1>İnternet bağlantısı yok</h1>
    <p>minokyo'yu görüntülemek için internet bağlantını kontrol edip tekrar dene.</p>
    <button onclick="location.href='https://minokyo.com'">Tekrar Dene</button>
  </main>
</body>
</html>
